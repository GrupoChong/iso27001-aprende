<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Curso interactivo de ISO/IEC 27001:2022 e ISO/IEC 27002:2022: lecciones, práctica con explicación de errores, audiolibro y modo estudio.">
<meta name="theme-color" content="#14284A">
<title>ISO 27001 Aprende</title>
<link rel="icon" type="image/svg+xml" href="marca/sello.svg">
<link rel="icon" type="image/png" sizes="32x32" href="marca/favicon-32.png">
<link rel="apple-touch-icon" href="marca/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script>
/* Fija claro/oscuro y movimiento antes de pintar, para que no parpadee al abrir. */
(function () {
  var r = document.documentElement; var a = {};
  try { a = (JSON.parse(localStorage.getItem('iso27001-aprende-v1') || '{}').ajustes) || {}; } catch (e) { /* sin almacenamiento */ }
  var t = a.tema || 'auto';
  var oscuro = t === 'oscuro' || (t === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  if (t !== 'auto') r.setAttribute('data-tema', t);
  r.setAttribute('data-modo', oscuro ? 'oscuro' : 'claro');
  r.setAttribute('data-movimiento', a.movimiento === 'reducido' ? 'reducido' : 'sistema');
})();
</script>
<style>
/* Pantalla de entrada (1.6.1): el sello con un anillo que se dibuja mientras carga y una barra fina de progreso.
   Va aquí, en el HTML, para que aparezca antes de que carguen los scripts y la hoja de estilos. */
#splash { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: #EDF0F3; color: #121A26; font-family: "IBM Plex Sans", Roboto, "Segoe UI", system-ui, sans-serif; transition: opacity .38s ease, visibility .38s; }
:root[data-modo="oscuro"] #splash { background: #0D1219; color: #E6EAF0; }
#splash.fuera { opacity: 0; visibility: hidden; }
.splash-sello { position: relative; width: 148px; height: 148px; }
.splash-sello img { position: absolute; inset: 12px; width: 124px; height: 124px; border-radius: 50%;
  box-shadow: 0 8px 22px rgba(0, 0, 0, .14); animation: splash-sello .7s cubic-bezier(.2, .7, .2, 1) both; }
:root[data-modo="oscuro"] .splash-sello img { box-shadow: 0 8px 22px rgba(0, 0, 0, .5); }
.splash-anillo { position: absolute; inset: 0; width: 148px; height: 148px; transform: rotate(-90deg); }
.splash-anillo circle { fill: none; stroke-width: 2.5; stroke-linecap: round; }
.splash-anillo .pista { stroke: rgba(20, 40, 74, .10); }
.splash-anillo .trazo { stroke: #2B7471; stroke-dasharray: 452; stroke-dashoffset: 452; animation: splash-anillo 1.3s cubic-bezier(.4, 0, .2, 1) .2s forwards; }
:root[data-modo="oscuro"] .splash-anillo .pista { stroke: rgba(255, 255, 255, .10); }
:root[data-modo="oscuro"] .splash-anillo .trazo { stroke: #72AEA9; }
.splash-nombre { margin: 26px 0 4px; font-size: 1.22rem; font-weight: 600; letter-spacing: -.005em; animation: splash-texto .6s ease .25s both; }
.splash-sub { margin: 0; font-size: .86rem; font-weight: 400; letter-spacing: .01em; color: #5A6676; animation: splash-texto .6s ease .35s both; }
:root[data-modo="oscuro"] .splash-sub { color: #8E9AAB; }
.splash-barra { position: absolute; bottom: calc(64px + env(safe-area-inset-bottom)); width: 128px; height: 3px; border-radius: 3px; overflow: hidden; background: rgba(20, 40, 74, .12); }
.splash-barra span { display: block; width: 38%; height: 100%; border-radius: 3px; background: #14284A; animation: splash-barra 1.1s ease-in-out infinite; }
:root[data-modo="oscuro"] .splash-barra { background: rgba(255, 255, 255, .12); }
:root[data-modo="oscuro"] .splash-barra span { background: #72AEA9; }
@keyframes splash-sello { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: none; } }
@keyframes splash-anillo { to { stroke-dashoffset: 0; } }
@keyframes splash-texto { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes splash-barra { from { transform: translateX(-110%); } to { transform: translateX(280%); } }
@media (prefers-reduced-motion: reduce) { #splash *, #splash { animation: none !important; } .splash-anillo .trazo { stroke-dashoffset: 0; } }
:root[data-movimiento="reducido"] #splash * { animation: none !important; }
:root[data-movimiento="reducido"] .splash-anillo .trazo { stroke-dashoffset: 0; }
</style>
<link rel="preload" href="fuentes/ibm-plex-sans-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fuentes/ibm-plex-sans-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="splash" aria-hidden="true">
  <div class="splash-sello">
    <svg class="splash-anillo" viewBox="0 0 148 148"><circle class="pista" cx="74" cy="74" r="72"/><circle class="trazo" cx="74" cy="74" r="72"/></svg>
    <img src="marca/sello.svg" alt="">
  </div>
  <p class="splash-nombre">ISO 27001 Aprende</p>
  <p class="splash-sub">Seguridad de la información</p>
  <div class="splash-barra"><span></span></div>
</div>
<div id="foco-barra" hidden></div>
<main id="vista" tabindex="-1"></main>
<div id="mini" hidden></div>
<nav id="pestanas" aria-label="Secciones principales"></nav>
<div id="capa" hidden></div>
<div id="avisos" role="status" aria-live="polite"></div>
<audio id="reproductor" preload="metadata"></audio>
<script src="contenido.js"></script>
<script src="iconos.js"></script>
<script src="base.js"></script>
<script src="simulacro.js"></script>
<script src="cuestionarios.js"></script>
<script src="vistas.js"></script>
<script src="practica.js"></script>
<script src="herramientas.js"></script>
<script src="clases.js"></script>
<script>
/* Retira la pantalla de entrada cuando la app ya está lista, con un mínimo de 1,4 s para que la carga se vea completa. */
(function () {
  var s = document.getElementById('splash'); if (!s) return;
  var minimo = document.documentElement.getAttribute('data-movimiento') === 'reducido' ? 500 : 1400;
  function quitar() {
    setTimeout(function () { s.classList.add('fuera'); setTimeout(function () { s.remove(); }, 420); }, Math.max(0, minimo - performance.now()));
  }
  if (document.readyState === 'complete') quitar(); else window.addEventListener('load', quitar);
})();
</script>
</body>
</html>
